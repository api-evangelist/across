apis:
- name: Across Swap API
  description: The unified REST entry point for all crosschain operations on Across — request swap/bridge quotes and approval data, execute embedded crosschain actions on the destination chain, run gasless flows, enumerate supported chains/tokens/sources, and track deposit lifecycle status. Authentication is a Bearer API key plus a 2-byte hex integratorId query parameter; testnet requires no credentials.
