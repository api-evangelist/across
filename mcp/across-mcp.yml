description: Official Across MCP server that indexes the Across documentation and exposes live Swap API
  operations as tools. Works with Claude Desktop, Claude Code, Cursor, Codex, and Windsurf. A production
  instance is hosted at https://mcp.across.to/mcp over Streamable HTTP.
tools:
- name: search_across_docs
  description: Full-text search across the Across Protocol documentation. Use for any conceptual or how-to
    question about Across.
- name: get_page
  description: Get the full content of a specific Across documentation page. Accepts a path like '/reference/api-reference'
    or a keyword match. Prefer reading the `across://docs/...` resource directly when the path is known.
- name: get_code_examples
  description: Get code examples from Across docs. Filter by topic like 'sdk', 'swap', 'deposit', 'viem',
    'ethers'.
- name: recrawl_docs
  description: Kick off a background re-crawl of all Across documentation pages. Returns immediately;
    the index updates when the crawl completes.
- name: get_supported_chains
  description: List all chains supported by Across with their chain IDs, fetched live from the Across
    API.
- name: get_api_reference
  description: Get the Across REST API endpoint catalog. Pass an `endpoint` to filter; leave empty to
    list all.
- name: get_suggested_fees
  description: Live quote of bridge fees for a single-token transfer between two Across-supported chains.
- name: get_swap_quote
  description: Build a crosschain swap on Across. Returns the expected output, fees, and ready-to-sign
    calldata (`approvalTxns` + deposit `tx`). The client/user signs and broadcasts.
- name: track_deposit
  description: Look up the lifecycle status of an Across deposit by origin-chain tx hash or deposit ID.
- name: list_deposits
  description: Return recent Across deposits for a given depositor address.
- name: get_available_routes
  description: Discover supported (origin, destination, token) routes. All filters are optional; omit
    to list every route.
- name: get_limits
  description: Get the min/max transferrable amount for a given token between two chains.
- name: swap_with_wallet
  description: Open an interactive crosschain-swap view in the conversation. Fetches a live Across quote
    and renders a UI where the user verifies details, connects their wallet, and signs the deposit themselves.
    Use this when the user wants to actually execute a swap (not just see calldata). EVM mainnet origins
    only — the wallet connects via WalletConnect's Ethereum provider, so non-EVM chains (Solana, TRON)
    cannot be the origin here (they can be the destination). For non-EVM origins use get_swap_quote instead.
- name: track_deposit_app
  description: 'Internal: deposit-status lookup used by the swap UI to poll fill progress.'
